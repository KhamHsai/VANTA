[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vanta-training"
version = "0.1.0"
description = "MobileNetV3-Small training pipeline for VANTA"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

